services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sweety_db
      POSTGRES_USER: sweety_user
      POSTGRES_PASSWORD: sweety_local_password
    ports:
      - "5432:5432"
    volumes:
      - sweety_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety_user -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sweety_pgdata:
